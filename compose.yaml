services:
  db:
    image: postgres:17-alpine
    container_name: comfort-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: comfort
      POSTGRES_USER: comfort
      POSTGRES_PASSWORD: comfort
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfort -d comfort"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    container_name: comfort-api
    profiles: ["app"]
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/comfort
      DB_USER: comfort
      DB_PASSWORD: comfort
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_CITY_ID: ${OPENWEATHER_CITY_ID:-3936456}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: comfort-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@comfort.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmindata:
