spring:
  application:
    name: cloud-api

  datasource:
    # Por defecto apunta al Postgres de compose.yaml.
    # En despliegue se sobreescribe con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/comfort}
    username: ${DB_USER:comfort}
    password: ${DB_PASSWORD:comfort}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

openweather:
  base-url: https://api.openweathermap.org/data/2.5
  api-key: ${OPENWEATHER_API_KEY:}
  city-id: ${OPENWEATHER_CITY_ID:3936456}   # Lima, PE

logging:
  level:
    org.springframework.web: INFO
